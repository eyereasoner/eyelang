name: Publish release to GitHub and npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Update npm
        run: npm install -g npm@latest
      - name: Verify release version
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Run tests
        run: npm test
      - name: Check package contents
        run: npm pack --dry-run
      # Zenodo's native GitHub integration archives each published release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-from-tag
      - name: Publish to npm
        run: npm publish
