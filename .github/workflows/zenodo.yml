name: Publish to Zenodo

on:
  release:
    types: [published]

jobs:
  publish:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Publish to Zenodo
       uses: sbrisard/zenodo-action@v1
       with:
         client_id: ${{ secrets.ZENODO_TOKEN }}
         # Alternatively, use standard zenodo-upload action or a custom script if preferred
