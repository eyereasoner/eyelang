name: Fix issues 91 and 92

on:
  push:
    paths:
      - '.github/workflows/fix-issues-91-92.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply tested fixes
        shell: bash
        run: |
          cat > /tmp/fix.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/fix.patch.gz.b64 | gzip -d > /tmp/fix.patch
          patch -p1 < /tmp/fix.patch

      - name: Verify offline release gate
        run: npm run test:offline

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test examples the-art-of-eyeprolog.md
          git commit -m "Fix issues #91 and #92"
          git push origin HEAD:main
