name: Restore README history pointer

on:
  push:
    paths:
      - '.github/workflows/restore-readme-history.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore public history pointer and accept longer README
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          compact_reference = (
              'The single implementation reference is [*The Art of EyeProlog*](the-art-of-eyeprolog.md). '
              'It documents the language, built-ins, libraries, command line, JavaScript API, examples, proofs, '
              'conformance profile, and implementation.'
          )
          wrapped_reference = (
              'The single implementation reference is [*The Art of EyeProlog*](the-art-of-eyeprolog.md).\n'
              'It documents the language, built-ins, libraries, command line, JavaScript API,\n'
              'examples, proofs, conformance profile, and implementation.'
          )
          assert compact_reference in text
          text = text.replace(compact_reference, wrapped_reference, 1)

          history = (
              'The Euler project began in 2001 and became EYE, a Prolog-based reasoner, in 2006; it is still alive '
              'in 2026. In a symbolic way, EYE remembers Leonhard Euler, who lost sight in one eye. The Retina '
              'project began in 2021 and became EyeProlog in 2026; we hope to keep it growing for the next twenty '
              'years. That continuation offers a second quiet remembrance of Euler, who later lost sight in his '
              'other eye—while the project keeps trying to see farther through logic, proof, and reasoning.'
          )
          heading = '## Twenty years of EYE, and the next twenty years'
          assert history in text
          assert heading not in text
          text = text.replace(history, f'{heading}\n\n{history}', 1)
          readme.write_text(text)

          regression = Path('test/run-regression.mjs')
          text = regression.read_text()
          old_name = "name: 'public ISO documentation keeps README concise and the book authoritative',"
          new_name = "name: 'public ISO documentation keeps the book authoritative',"
          cap = "        assertEqual(readme.split('\\n').length <= 100, true, 'README remains a compact entry point');\n"
          assert old_name in text
          assert cap in text
          text = text.replace(old_name, new_name, 1).replace(cap, '', 1)
          regression.write_text(text)

      - name: Verify documentation suite
        run: node test/run-regression.mjs docs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md test/run-regression.mjs
          git commit -m "Restore README history pointer and accept longer README"
          git push origin HEAD:main
