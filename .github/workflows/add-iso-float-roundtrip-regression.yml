name: Add ISO float round-trip regression

on:
  push:
    paths:
      - '.github/workflows/add-iso-float-roundtrip-regression.yml'

permissions:
  contents: write

jobs:
  add-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add ISO float round-trip regression
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/run-iso-strict.mjs')
          text = path.read_text()
          anchor = "  reporter.test('keeps Corrigendum 2 core predicates and excludes Part 3 phrase', () => {\n"
          assert anchor in text
          test = r'''  reporter.test('round-trips ISO floats through number_chars/2 and quoted write_term/2', () => {
            for (const literal of ['1.0000000000000001', '0.10000000000000002']) {
              const converted = run('', {
                isoStrict: true,
                goal: `N=${literal}, number_chars(N,Chars), number_chars(M,Chars), M == N`,
              });
              equal(converted.stats.completed_goal_lists, 1, `number_chars/2 float round-trip ${literal}`);

              const written = run('', {
                isoStrict: true,
                goal: `write_term(${literal},[quoted(true)])`,
              }).stdout.trim();
              const reread = run('', {
                isoStrict: true,
                goal: `read_term(X,[]), X == ${literal}`,
                ioOptions: { input: `${written}.` },
              });
              equal(reread.stats.completed_goal_lists, 1, `quoted write_term/2 float round-trip ${literal}`);
            }
          });

          '''
          text = text.replace(anchor, test + anchor, 1)
          path.write_text(text)

      - name: Verify strict ISO suite
        run: node test/run-iso-strict.mjs

      - name: Commit regression and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-iso-float-roundtrip-regression.yml
          git add test/run-iso-strict.mjs
          git commit -m "Add ISO float round-trip regression coverage"
          git push origin HEAD:main
